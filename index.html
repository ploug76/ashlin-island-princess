<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ashlin as the Island Princess</title>
<meta name="theme-color" content="#1b6fa8">
<meta name="description" content="Ashlin as the Island Princess: a story adventure in 11 chapters.">
<meta property="og:title" content="Ashlin as the Island Princess">

<body>
<canvas id="cv"></canvas>
<!-- Studio logo hook: Peter has not picked a studio for this game yet. Set CONFIG.studioLogo in js/core.js
     (e.g. 'logo-589.png' or 'logo-boh.png') and it shows tiny in the corner. Empty = nothing shown. -->
<img id="studioLogo" alt="" hidden>
<div id="ui">
 <section id="title" class="screen">
  <header id="titleHead"><h1>Ashlin<span>as the</span>Island Princess</h1></header>
  <div id="titleBtns">
   <button id="bPlay" class="big">PLAY</button>
   <button id="bChapters">CHAPTERS</button>
   <button id="bSound" class="small">Sound: On</button>
  </div>
 </section>
 <section id="chapters" class="screen" hidden>
  <h2>Chapters</h2>
  <div id="chList"></div>
  <button id="bChBack" class="small">Back</button>
 </section>
 <section id="story" class="screen" hidden>
  <div id="storyBox">
   <div id="spk"></div>
   <div id="txt"></div>
   <div class="row"><button id="bSkip" class="small">Skip</button><button id="bNext">Next</button></div>
  </div>
 </section>
 <section id="howto" class="screen card" hidden>
  <div class="cardIn"><h2 id="htTitle"></h2><p id="htText"></p><button id="bStart" class="big">START</button></div>
 </section>
 <div id="hud" hidden><span id="hudCh"></span><span id="hudInfo"></span><button id="bPause" aria-label="Pause">II</button></div>
 <section id="pause" class="screen card" hidden>
  <div class="cardIn"><h2>Paused</h2><button id="bResume" class="big">Resume</button><button id="bSkipGame">Skip this game</button><button id="bPChapters">Chapters</button><button id="bPSound" class="small">Sound: On</button></div>
 </section>
 <section id="result" class="screen card" hidden>
  <div class="cardIn"><h2 id="rsTitle"></h2><div id="rsStars"></div><p id="rsText"></p><button id="bContinue" class="big">Continue</button></div>
 </section>
 <div id="toast"></div>
</div>
